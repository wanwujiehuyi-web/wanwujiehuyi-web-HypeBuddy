<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三汇蔡徐坤 · 摆龙门阵</title>
<style>
/* ============================================================
   配色 —— 亮色版，让三汇的照片当主角
   ------------------------------------------------------------
   思路：照片是主角，界面是"浮在照片上的毛玻璃"。
        所以面板全部半透明 + backdrop-filter 模糊，
        既不挡住风景，又保证文字读得清。

   --ink       暖墨色     正文
   --vinegar   三汇特醋   主色（在亮底上要加深，不然看不清）
   --caiting   三汇彩亭   强调色
   --river     渠江       状态提示
   ============================================================ */
:root{
  --ink:#33281a;
  --ink-2:#7d6b53;
  --ink-3:#a1917a;
  /* 【关键】模糊半径加大到 22px。
     模糊保留颜色的"色块感"，但抹掉细节 ——
     所以透明度可以压到很低，字照样认得清，
     背景又能整块透上来。这是毛玻璃能不能透的关键。 */
  --glass:rgba(255,255,255,.60);
  --glass-strong:rgba(255,255,255,.70);
  --glass-soft:rgba(255,255,255,.42);
  --line:rgba(120,95,60,.20);
  --line-2:rgba(120,95,60,.30);
  --vinegar:#a86c15;
  --vinegar-lit:#d69a35;
  --caiting:#bc3a2c;
  --river:#2b7a6b;
  --radius:16px;
  --shadow:0 6px 24px rgba(70,52,26,.13);
  --font:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
  --serif:"Songti SC","STSong","SimSun",serif;
  --blur:blur(22px) saturate(1.75);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);
  color:var(--ink);
  overflow:hidden;
  /* ---------- 背景：三汇实景照片 ----------
     assets/bg.jpg = 渠江 + 文峰塔 + 跨江大桥，原图直出，没压暗。
     【坑】background-size:cover 时容器越窄裁得越多。
     白塔在照片 78% 处，用 center 会在宽屏下被裁掉，所以定位偏右到 60%。 */
  background:url('/assets/bg.jpg') 60% 42% / cover no-repeat fixed;
}
/* 照片上罩一层极淡的暖白，让面板浮得起来，但不影响看景 */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:linear-gradient(180deg,
    rgba(255,252,246,.30) 0%,
    rgba(255,252,246,.06) 28%,
    rgba(255,252,246,.06) 70%,
    rgba(255,252,246,.34) 100%);
}

/* ---------- 布局 ---------- */
.app{display:flex;height:100vh;position:relative;z-index:1}
.main{flex:1;display:flex;flex-direction:column;min-width:0}

/* ---------- 顶栏 ---------- */
header{
  position:relative;flex:none;
  padding:15px 24px 14px;
  background:var(--glass);
  backdrop-filter:var(--blur);
  -webkit-backdrop-filter:var(--blur);
  border-bottom:1px solid var(--line);
  box-shadow:0 2px 18px rgba(70,52,26,.09);
}
/* 顶栏底下压一道细金线，提亮整块面板 */
header::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:2.5px;
  background:linear-gradient(90deg,transparent,var(--vinegar-lit),var(--caiting),transparent);
  opacity:.5;
}
.brand{display:flex;align-items:center;gap:15px}
/* 头像：全身像，所以是竖版圆角矩形，不是圆的 */
.face{
  width:60px;height:84px;flex:none;border-radius:15px;
  border:2.5px solid #fff;
  box-shadow:0 0 0 2px var(--vinegar-lit), 0 6px 20px rgba(70,52,26,.24);
  object-fit:cover;
  background:#cfe3ee;
}
.title{font-family:var(--serif);font-size:21px;font-weight:700;letter-spacing:1.5px}
.title em{font-style:normal;color:var(--vinegar)}
.sub{font-size:12px;color:var(--ink-2);margin-top:4px;letter-spacing:.4px}
.sub b{color:var(--river);font-weight:600}

/* 印章：三汇两个字竖排，朱红底白字，像盖上去的 */
.seal{
  margin-left:auto;flex:none;
  width:50px;height:50px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,#cb4b36,#96271a);
  border-radius:9px;
  color:#fff;font-family:var(--serif);font-weight:700;font-size:16.5px;
  line-height:1;letter-spacing:1px;
  writing-mode:vertical-rl;
  box-shadow:0 5px 16px rgba(150,39,26,.34),
             inset 0 0 0 2px rgba(255,255,255,.26),
             inset 0 0 12px rgba(0,0,0,.18);
  transform:rotate(-3.5deg);
  user-select:none;
}

/* ---------- 聊天区：完全透明，让照片露出来 ---------- */
#chat{
  flex:1;overflow-y:auto;padding:26px 26px 12px;
  display:flex;flex-direction:column;gap:18px;
  scroll-behavior:smooth;
}
#chat::-webkit-scrollbar{width:9px}
#chat::-webkit-scrollbar-thumb{background:rgba(120,95,60,.32);border-radius:5px}
#chat::-webkit-scrollbar-track{background:rgba(255,255,255,.18)}

.row{display:flex;gap:11px;max-width:80%;animation:rise .34s cubic-bezier(.2,.9,.3,1) both}
.row.me{align-self:flex-end;flex-direction:row-reverse}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.avatar{
  width:46px;height:64px;flex:none;border-radius:13px;overflow:hidden;
  display:grid;place-items:center;font-size:17px;
  border:2px solid rgba(255,255,255,.92);
  box-shadow:0 4px 16px rgba(70,52,26,.20);
  align-self:flex-start;
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.row.me .avatar{background:var(--glass-strong);backdrop-filter:var(--blur)}

.bubble{
  /* 半透明毛玻璃：背景的绿和蓝会透上来，气泡跟着照片一起变。
     之所以敢压到 .52 还不怕看不清字 —— 全靠上面那 22px 的模糊。
     模糊把照片的细节抹平了，只剩色块，所以深色字压得住。 */
  background:linear-gradient(158deg,rgba(255,255,255,.68),rgba(255,253,248,.50));
  backdrop-filter:var(--blur);
  -webkit-backdrop-filter:var(--blur);
  border:1px solid rgba(255,255,255,.72);
  border-radius:var(--radius);
  padding:15px 19px;
  line-height:1.86;font-size:15px;white-space:pre-wrap;word-break:break-word;
  box-shadow:
    0 8px 30px rgba(70,52,26,.15),
    0 1px 0 rgba(255,255,255,.85) inset;
  position:relative;
}
.row.bot .bubble{border-top-left-radius:5px}
/* 自己的气泡：琥珀色也做成半透明的。
   底色调深一点，白字才在照片上立得住 */
.row.me .bubble{
  border-top-right-radius:5px;
  background:linear-gradient(150deg,rgba(180,116,26,.82),rgba(132,80,10,.76));
  border-color:rgba(255,255,255,.30);
  color:#fffdf8;
  text-shadow:0 1px 3px rgba(80,45,0,.35);
  box-shadow:
    0 8px 28px rgba(120,75,10,.28),
    0 1px 0 rgba(255,255,255,.26) inset;
}

/* 怪叫：朱红胶囊，跟正文分开 */
.shout{
  display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,var(--caiting),#8f2a1d);
  border:none;color:#fff;
  font-family:var(--serif);font-weight:700;
  padding:6px 15px;border-radius:999px;font-size:15px;letter-spacing:1.5px;
  box-shadow:0 4px 16px rgba(188,58,44,.36);
  animation:pulse 1.3s ease-in-out infinite alternate;
}
@keyframes pulse{
  from{box-shadow:0 4px 16px rgba(188,58,44,.30)}
  to{box-shadow:0 4px 22px rgba(188,58,44,.62)}
}
.shout-wrap{margin:2px 0 10px}
.shout-wrap.below{margin:10px 0 2px}

/* 状态条 */
.status{
  display:flex;align-items:center;gap:9px;
  font-size:13.5px;color:var(--river);font-weight:500;
}
.dots span{
  display:inline-block;width:6px;height:6px;margin-right:3px;border-radius:50%;
  background:var(--river);animation:blink 1.1s infinite;
}
.dots span:nth-child(2){animation-delay:.18s}
.dots span:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

.cursor{
  display:inline-block;width:2px;height:17px;margin-left:2px;
  background:var(--vinegar);vertical-align:-3px;border-radius:1px;
  animation:blink2 .75s steps(1) infinite;
}
@keyframes blink2{50%{opacity:0}}

/* ---------- 底栏 ---------- */
footer{
  /* 【改过】底栏原来有一层 60% 的白玻璃，输入框里又套一层 44%，
     两层叠起来 = 78% 白，看着跟实心白条一样，照片全被糊住了。
     现在底栏的底色整个撤掉 —— 只留输入框一块玻璃漂在照片上。 */
  flex:none;padding:16px 26px 20px;
  background:none;
  border-top:none;
}
.inputbar{
  display:flex;gap:10px;align-items:center;
  /* 唯一的一块玻璃。平时 52% 透，点进去 70% ——
     底栏已经没底色了，所以它透出来的就是真照片。 */
  background:rgba(255,255,255,.46);
  backdrop-filter:blur(26px) saturate(1.85);
  -webkit-backdrop-filter:blur(26px) saturate(1.85);
  border:1.5px solid rgba(255,255,255,.86);
  border-radius:999px;padding:5px 5px 5px 22px;
  box-shadow:
    0 10px 30px rgba(60,45,25,.16),
    0 1px 0 rgba(255,255,255,.95) inset;
  transition:background .22s ease, border-color .22s ease, box-shadow .22s ease;
}
/* 聚焦时只亮一点点（.46 → .60）。
   页面加载就会自动聚焦，所以这一档不能设太亮，不然一进来就是块白板。 */
.inputbar:focus-within{
  background:rgba(255,255,255,.60);
  border-color:var(--vinegar);
  box-shadow:
    0 0 0 4px rgba(168,108,21,.16),
    0 12px 32px rgba(60,45,25,.19),
    0 1px 0 rgba(255,255,255,.95) inset;
}
#q{
  flex:1;background:none;border:none;outline:none;
  color:var(--ink);font-size:15px;font-family:var(--font);
  padding:9px 0;
}
#q::placeholder{color:var(--ink-2)}
#send{
  flex:none;border:none;cursor:pointer;
  font-family:var(--serif);font-weight:700;font-size:15.5px;letter-spacing:2px;
  color:#fffdf8;padding:11px 26px;border-radius:999px;
  background:linear-gradient(135deg,#cb9130,#9d6410);
  box-shadow:0 5px 16px rgba(150,95,15,.36), 0 1px 0 rgba(255,255,255,.28) inset;
  transition:transform .15s, filter .2s, box-shadow .2s;
}
#send:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px);
  box-shadow:0 7px 20px rgba(150,95,15,.46), 0 1px 0 rgba(255,255,255,.28) inset}
#send:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}

/* 提示文字直接压在照片上，所以给一层"白晕"当底 ——
   深色字 + 白色描边光晕，压在绿树上也读得清，还不用糊一块玻璃。 */
.hint{
  font-size:12.5px;color:var(--ink);margin-top:12px;padding-left:8px;
  display:flex;gap:16px;flex-wrap:wrap;align-items:center;
  text-shadow:
    0 1px 3px rgba(255,255,255,.95),
    0 0 10px rgba(255,255,255,.85),
    0 0 20px rgba(255,255,255,.6);
}
.hint b{color:var(--vinegar);font-weight:700}

/* 提示栏右端两个小按钮并排。.memtoggle 自带 margin-left:auto，
   在 flex 容器里会把第一个按钮顶开，所以容器里要清掉它 */
.hint .btns{margin-left:auto;display:flex;gap:9px}
.hint .btns .memtoggle{margin-left:0}

/* 记忆开关：默认关。放在提示栏最后，不显眼 ——
   想找的人看得见，不想找的人不碍事。点了才会在聊天里冒记忆卡片。 */
.memtoggle{
  margin-left:auto;flex:none;cursor:pointer;
  font-family:var(--font);font-size:12.5px;
  color:var(--ink);
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(14px) saturate(1.6);
  -webkit-backdrop-filter:blur(14px) saturate(1.6);
  border:1px solid rgba(255,255,255,.85);
  border-radius:999px;padding:5px 15px;
  box-shadow:0 3px 12px rgba(60,45,25,.12);
  transition:all .18s ease;
}
.memtoggle:hover{border-color:var(--vinegar);color:var(--vinegar)}
.memtoggle.on{
  background:linear-gradient(135deg,#c58c2c,#a26713);
  border-color:transparent;color:#fffdf8;
  box-shadow:0 3px 12px rgba(160,103,19,.32);
}
/* 印章也能点，算个彩蛋 —— 谁知道去点它，谁就发现 */
.seal{cursor:pointer;transition:transform .2s ease, box-shadow .2s ease}
.seal:hover{transform:rotate(0deg) scale(1.06);box-shadow:0 7px 22px rgba(150,39,26,.48),
  inset 0 0 0 2px rgba(255,255,255,.3), inset 0 0 12px rgba(0,0,0,.18)}

/* ---------- 记忆卡片：直接在聊天里冒出来 ----------
   原来是个常驻侧栏，太占地方。改成"它记住了什么，就在对话里冒一张小卡片"——
   不占空间，而且比侧栏更有"它真的在记"的实时感。 */
.memo{
  align-self:center;
  display:inline-flex;align-items:center;gap:9px;
  max-width:76%;
  background:linear-gradient(150deg,rgba(255,255,255,.62),rgba(255,249,238,.44));
  backdrop-filter:var(--blur);
  -webkit-backdrop-filter:var(--blur);
  border:1.5px dashed rgba(168,108,21,.52);
  border-radius:999px;
  padding:9px 20px 9px 15px;
  font-size:13px;line-height:1.5;color:var(--ink);
  box-shadow:0 5px 20px rgba(70,52,26,.12), 0 1px 0 rgba(255,255,255,.7) inset;
  animation:rise .38s cubic-bezier(.2,.9,.3,1) both;
}
.memo .ico{font-size:15px;flex:none}
.memo b{color:var(--vinegar);font-weight:700}

/* ---------- 新客进门的「三汇小传」 ----------
   头回点进来的人，先认地方、再认人。
   卡片分三段：山水 → 人间 → 吃，每段左边一条彩色的竖条。
   长文没有这个分节会糊成一片，读者两眼一抹黑就划走了。 */
/* 小传比其他消息宽一点，但宽屏下封顶 780px ——
   一行上百个字眼睛会跟丢，排版上讲不通 */
.row.intro-row{max-width:min(88%,780px)}
.intro{white-space:normal;font-size:14.5px;line-height:1.92}

.intro-hd{
  display:flex;align-items:center;gap:12px;
  margin-bottom:15px;padding-bottom:13px;
  border-bottom:1px dashed rgba(120,95,60,.28);
}
.intro-seal{
  flex:none;width:38px;height:38px;display:grid;place-items:center;
  background:linear-gradient(150deg,#cb4b36,#96271a);border-radius:8px;
  color:#fff;font-family:var(--serif);font-weight:700;font-size:12.5px;
  line-height:1.05;letter-spacing:.5px;writing-mode:vertical-rl;
  box-shadow:0 4px 13px rgba(150,39,26,.30),
             inset 0 0 0 1.5px rgba(255,255,255,.26);
  transform:rotate(-3deg);
}
.intro-ht{font-family:var(--serif);font-size:18.5px;font-weight:700;letter-spacing:1px}
.intro-hs{font-size:12px;color:var(--ink-2);margin-top:3px;letter-spacing:.3px}
.intro-hs b{color:var(--river);font-weight:600}

.intro-lead{font-size:14.5px;margin-bottom:16px}
.intro-sec{margin:0 0 16px;padding:1px 0 1px 14px;border-left:3px solid var(--line-2)}
.intro-sec.nature{border-left-color:var(--river)}
.intro-sec.people{border-left-color:var(--caiting)}
.intro-h{
  font-family:var(--serif);font-size:16px;font-weight:700;
  letter-spacing:.8px;margin-bottom:9px;
}
.intro-sec.nature .intro-h{color:var(--river)}
.intro-sec.people .intro-h{color:var(--caiting)}
.intro p{margin:0 0 8px}
.intro p:last-child{margin-bottom:0}
.intro b{font-weight:700}
.intro .kn{color:var(--river);font-weight:700}      /* 山水里的关键词 */
.intro .kc{color:var(--caiting);font-weight:700}    /* 人文里的关键词 */
.intro .kv{color:var(--vinegar);font-weight:700}    /* 吃食 / 醋 */
/* 引文：老县志、老歌谣。换成衬线体，跟正文分开 */
.intro .verse{
  font-family:var(--serif);font-size:13.5px;color:var(--ink-2);
  background:rgba(255,255,255,.44);border-radius:10px;
  padding:9px 14px;margin:9px 0 0;letter-spacing:.6px;line-height:1.9;
}
.intro ul{margin:7px 0 0;padding-left:2px;list-style:none}
.intro li{margin-bottom:5px;padding-left:15px;position:relative}
.intro li::before{
  content:"";position:absolute;left:2px;top:.72em;
  width:5px;height:5px;border-radius:50%;background:var(--line-2);
}
.intro-sec.nature li::before{background:var(--river);opacity:.55}
.intro-sec.people li::before{background:var(--caiting);opacity:.55}
.intro-end{
  margin-top:15px;padding-top:13px;font-size:14px;color:var(--ink-2);
  border-top:1px dashed rgba(120,95,60,.28);
}
/* 回头客那条里的小入口，点一下就重放小传 */
.reintro{
  display:inline-block;margin-top:9px;cursor:pointer;
  font-size:13px;color:var(--vinegar);
  border-bottom:1px dashed rgba(168,108,21,.55);
}

/* ---------- 窄屏 ---------- */
@media (max-width:820px){
  .row{max-width:93%}
  .row.intro-row{max-width:97%}
  .memo{max-width:90%}
  .intro{font-size:14px}
  #chat{padding:18px 14px 8px}
  header,footer{padding-left:16px;padding-right:16px}
  /* 窄屏裁得更狠，直接把镜头怼到白塔上 */
  body{background-position:78% 40%}
  .face{width:46px;height:64px}
  .seal{width:42px;height:42px;font-size:14px}
}
</style>
</head>
<body>
<div class="app">

  <div class="main">
    <header>
      <div class="brand">
        <img class="face" src="/assets/avatar" alt="三汇蔡徐坤">
        <div>
          <div class="title">三汇<em>蔡徐坤</em></div>
          <div class="sub">四川 · 达州 · 渠县<b>三汇镇</b> ｜ 渠江边上的 AI 搭子</div>
        </div>
        <div class="seal" title="四川达州渠县三汇">三汇</div>
      </div>
    </header>

    <main id="chat"></main>

    <footer>
      <div class="inputbar">
        <input id="q" placeholder="摆两句嘛……" autocomplete="off">
        <button id="send">要得</button>
      </div>
      <div class="hint">
        <span><b>回车</b> 发送</span>
        <span><b>试试</b> 「三汇今天天气咋样」「今天有啥子新闻」「我叫小李」</span>
        <span class="btns">
          <button class="memtoggle" id="introToggle" title="再听一遍三汇的小传">🏞 三汇</button>
          <button class="memtoggle" id="memToggle" title="看看它记住了你啥子">🧠 记忆</button>
        </span>
      </div>
    </footer>
  </div>

  <!-- 侧栏已经删掉了。记忆改在聊天里以"记忆卡片"的形式出现，
       原因：侧栏常驻太占地方，而聊天里冒出来的东西更有"它真的记住了"的感觉 -->

</div>

<script>
/* 【坑】浏览器默认会"恢复上次的滚动位置"：刷新之后，
   它会把 #chat 拽回你上次滚到的地方（而且因为 smooth，是动画着拽过去的）。
   聊天页刷新就等于开新局，消息都没了，恢复旧位置毫无意义，
   还会把新客的小传顶到屏幕外。这里直接关掉，位置由我们自己定。 */
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

const chat = document.getElementById('chat');
const input = document.getElementById('q');
const sendBtn = document.getElementById('send');

const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* 两个头像。搭子用 assets/avatar.svg，想换图直接替换那个文件就行 */
const FACE_BOT = '<img src="/assets/avatar" alt="">';
const FACE_ME  = '👤';

/* ---------- 画消息 ----------
   noScroll：默认画完滚到底（聊天就该这样）。
   但小传那条不能滚到底 —— 它还得自己定位到开头（见 showIntro）。 */
function addRow(who, html, noScroll){
  const row = document.createElement('div');
  row.className = 'row ' + who;
  row.innerHTML = `
    <div class="avatar">${who === 'me' ? FACE_ME : FACE_BOT}</div>
    <div class="bubble">${html}</div>`;
  chat.appendChild(row);
  if (!noScroll) chat.scrollTop = chat.scrollHeight;
  return row;
}

function addUser(text){
  const row = document.createElement('div');
  row.className = 'row me';
  row.innerHTML = `<div class="avatar">${FACE_ME}</div><div class="bubble"></div>`;
  row.querySelector('.bubble').textContent = text;
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

/* ---------- 打字机 ---------- */
async function typewrite(el, text){
  for (let i = 0; i < text.length; i++){
    el.textContent = text.slice(0, i + 1);
    if (i % 3 === 0) chat.scrollTop = chat.scrollHeight;
    await sleep(text[i] === '\n' ? 26 : 11);
  }
  el.textContent = text;
  chat.scrollTop = chat.scrollHeight;
}

/* ---------- 发消息 ---------- */
async function send(){
  const q = input.value.trim();
  if (!q || sendBtn.disabled) return;
  input.value = '';
  sendBtn.disabled = true;

  addUser(q);

  const row = document.createElement('div');
  row.className = 'row bot';
  row.innerHTML = `<div class="avatar">${FACE_BOT}</div><div class="bubble">
      <div class="status"><span class="dots"><span></span><span></span><span></span></span>
      <span class="stext">正在琢磨…</span></div>
    </div>`;
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  const bubble = row.querySelector('.bubble');
  const stext = row.querySelector('.stext');

  try{
    const start = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({q})
    }).then(r => r.json());

    if (start.error) throw new Error(start.error);

    // 轮询：一边等，一边把"正在查天气…"实时显示出来
    let job;
    do {
      await sleep(320);
      job = await fetch('/api/status?id=' + start.id).then(r => r.json());
      if (job.status) stext.textContent = job.status;
    } while (!job.done);

    bubble.innerHTML = '';
    if (job.error) throw new Error(job.error);

    if (job.shout && !job.shout_after){
      const w = document.createElement('div');
      w.className = 'shout-wrap';
      w.innerHTML = `<span class="shout">${esc(job.shout)}</span>`;
      bubble.appendChild(w);
    }
    const p = document.createElement('div');
    p.innerHTML = '<span class="cursor"></span>';
    bubble.appendChild(p);
    await typewrite(p, job.body);
    p.querySelector('.cursor')?.remove();

    if (job.shout && job.shout_after){
      const w = document.createElement('div');
      w.className = 'shout-wrap below';
      w.innerHTML = `<span class="shout">${esc(job.shout)}</span>`;
      bubble.appendChild(w);
    }

    checkMemory();
  } catch(e){
    bubble.innerHTML = `<div class="status" style="color:#bc3a2c">
      出拐了：${esc(String(e.message || e))}</div>`;
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

/* ---------- 记忆：默认藏起来，点了开关才露 ----------
   为什么不默认显示：记忆是这项目的技术亮点，但一上来就往屏幕上堆卡片太吵。
   改成"想看的自己找"—— 提示栏右下角那个「🧠 记忆」，
   或者点顶栏那枚「三汇」印章（算个彩蛋，谁知道点谁知道）。 */
let showMemory = false;
let seenFacts = 0;      // 已经冒过几条，避免同一张卡片重复出现

function addMemo(html){
  const el = document.createElement('div');
  el.className = 'memo';
  el.innerHTML = `<span class="ico">🧠</span><span>${html}</span>`;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
}

function clearMemos(){
  chat.querySelectorAll('.memo').forEach(e => e.remove());
}

/* 打开开关：把已有的记忆一次性铺出来 */
async function showAllMemos(){
  try{
    const d = await fetch('/api/memory').then(r => r.json());
    seenFacts = d.facts.length;
    if (!d.facts.length){
      addMemo('还啥子都没记住。跟它说两句你的事嘛，比如「我叫小李，在三汇开面馆」。');
      return;
    }
    d.facts.forEach(f => addMemo(`记住了 <b>${esc(f.fact)}</b>`));
    addMemo(`一共 <b>${d.facts.length}</b> 条`);
  }catch(e){ /* 取不到记忆不影响聊天 */ }
}

async function toggleMemory(){
  showMemory = !showMemory;
  document.getElementById('memToggle').classList.toggle('on', showMemory);
  if (showMemory){ seenFacts = 0; await showAllMemos(); }
  else clearMemos();
}

/* 收到回复后：只有开关开着，才把新学到的冒出来 */
async function checkMemory(){
  if (!showMemory) return;
  try{
    const d = await fetch('/api/memory').then(r => r.json());
    const fresh = d.facts.slice(seenFacts);
    seenFacts = d.facts.length;
    fresh.slice(0, 3).forEach(f => addMemo(`记住了 <b>${esc(f.fact)}</b>`));
    if (fresh.length > 3) addMemo(`……还记住了 <b>${fresh.length - 3}</b> 条`);
  }catch(e){ /* 取不到记忆不影响聊天 */ }
}

/* ---------- 事件 ---------- */
sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
/* 记忆开关有两个入口：提示栏的按钮，和顶栏那枚印章（彩蛋） */
document.getElementById('memToggle').addEventListener('click', toggleMemory);
document.querySelector('.seal').addEventListener('click', toggleMemory);

/* ---------- 进门小传 ----------

   一百个人点进来看到的是同一份，不会因为模型哪次抽风就讲岔了，
   也不花一次调用的钱。

   只分两段：山水 / 人间。分得死板一点，别串味：
   · 山水 = 纯地理和自然环境。位置、江河、地形、气候、地下资源。
     【凡是人修的、人做的，一律不进这一段】—— 白塔是清道光的建筑，
     特醋是吃食，都算人文，不算"山水"。
   · 人间 = 从先秦一路讲到今天，按年代走。
     吃食不单开一节，按它出世的年代嵌进对应段落

   （行内换行处不出空格，所以每段正文都写成一行，别折） */
const INTRO_HTML = `

/* 回头客：不重播小传，只甩一句招呼，末尾留个入口想看的自己点 */
const HELLO_HTML = `
<div style="font-size:15px;line-height:1.85"><b style="color:var(--caiting);font-size:17px">也~</b> 又来啦！我是<b style="color:var(--vinegar)">三汇蔡徐坤</b>，渠江边上长大的。<br>查天气、搜新闻、摆龙门阵都行 —— <b>要得</b>噻！<div class="reintro" id="reIntro">🏞 想再听我摆哈三汇</div></div>`;

function showIntro(){
  /* 先清掉旧的那份 —— 不然"🏞 三汇"点几次就堆几份一样的长文，
     聊天记录糊成一锅粥。永远只留最新的一份。 */
  chat.querySelectorAll('.intro-row').forEach(e => e.remove());
  const row = addRow('bot', INTRO_HTML, true);
  row.classList.add('intro-row');
  /* 【关键】小传好几千字，addRow 默认滚到底 ——
     那样新客第一眼看到的是"吃"那一段，招呼和"先看山水"全压在头顶看不见。
     所以这里把它拽回来：让小传的顶头对齐到聊天区顶部。
     row 的 offsetParent 是 .app（.row 没定位），所以要减掉 chat 自己的 offsetTop。

     另外 #chat 上挂的是 scroll-behavior:smooth —— 不关掉的话，
     页面一加载就会当着新客的面从底往顶"哧溜"滑一大截，像页面抽风。
     这是"跳到这条消息开头"，不是"滚动"，要瞬间到位。 */
  chat.style.scrollBehavior = 'auto';
  chat.scrollTop = Math.max(0, row.offsetTop - chat.offsetTop - 20);
  chat.style.removeProperty('scroll-behavior');
  return row;
}

/* 首次访问判定。localStorage 在无痕模式下会抛异常，包一层别让它把页面搞挂 */
const SEEN_KEY = 'sanhui_intro_seen_v1';
let seen = false;
try { seen = !!localStorage.getItem(SEEN_KEY); } catch(e){}

if (seen){
  const r = addRow('bot', HELLO_HTML);
  r.querySelector('#reIntro').addEventListener('click', e => {
    e.target.remove();
    showIntro();
  });
} else {
  showIntro();
  try { localStorage.setItem(SEEN_KEY, '1'); } catch(e){}
}

document.getElementById('introToggle').addEventListener('click', () => {
  showIntro();
  input.focus();
});

input.focus();
</script>
