<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" width="100" height="140">
  <!--
    ============================================================
    三汇蔡徐坤 · 全身像
    ============================================================
    手绘 SVG，非 AI 生成。

    【造型】练习生风格的原创卡通角色：
      中分发缝 + 白T恤 + 牛仔背带裤 + 小白鞋 + 腋下夹篮球
      这是屏幕上那种"练习生耍帅"的经典姿势，
      不是任何真人的肖像。

    【背景】把三汇装进去：
      天蓝渐变 = 照片的天空
      一抹远山 = 照片的青山
      小白塔   = 照片里的文峰塔（人物左肩旁边）
      太阳光晕 = 照片的阳光

    【为什么是 100x140】
      全身像得是竖的。头像框也相应改成竖版圆角矩形，
      跟聊天里那种小圆头像不一样 —— 它更像一张"角色卡"。
    ============================================================
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#8ec4e8"/>
      <stop offset="46%"  stop-color="#bedeef"/>
      <stop offset="100%" stop-color="#eee7d6"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#84b18f"/>
      <stop offset="100%" stop-color="#527c62"/>
    </linearGradient>
    <linearGradient id="skin" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0%"   stop-color="#f9d8ad"/>
      <stop offset="100%" stop-color="#dfa971"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3b312b"/>
      <stop offset="100%" stop-color="#191411"/>
    </linearGradient>
    <linearGradient id="denim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#5f83aa"/>
      <stop offset="100%" stop-color="#395573"/>
    </linearGradient>
    <linearGradient id="tee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eeeadf"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="100" height="140" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- ================= 背景：三汇 ================= -->
    <rect width="100" height="140" fill="url(#sky)"/>
    <circle cx="21" cy="22" r="15" fill="#fff8e2" opacity=".55"/>
    <circle cx="21" cy="22" r="7" fill="#fffdf4" opacity=".6"/>
    <!-- 远山 -->
    <path d="M-4 96 Q20 82 42 93 Q66 105 104 88 L104 140 L-4 140 Z" fill="#a9c6b2"/>
    <path d="M-4 104 Q24 92 50 102 Q78 112 104 98 L104 140 L-4 140 Z" fill="url(#hill)"/>
    <!-- 山上的小白塔（照片里的文峰塔） -->
    <g transform="translate(24,74) scale(0.30)">
      <rect x="-4" y="0" width="8" height="34" fill="#f6f3ea"/>
      <g fill="#e8e3d6">
        <path d="M-13 2 L13 2 L11 -2 L-11 -2 Z"/>
        <path d="M-12 10 L12 10 L10 6 L-10 6 Z"/>
        <path d="M-11 18 L11 18 L9 14 L-9 14 Z"/>
        <path d="M-10 26 L10 26 L8 22 L-8 22 Z"/>
      </g>
      <path d="M-9 34 L9 34 L6 32 L-6 32 Z" fill="#dfd9c9"/>
      <path d="M-2 -2 L2 -2 L0 -12 Z" fill="#dad3c3"/>
    </g>

    <!-- ================= 人物 ================= -->
    <!-- = 腿 = -->
    <path d="M35 78 L34 120 L45 120 L45 78 Z" fill="url(#denim)"/>
    <path d="M55 78 L55 120 L66 120 L65 78 Z" fill="url(#denim)"/>
    <!-- 裤子的中缝，让腿分开得清楚 -->
    <line x1="45" y1="78" x2="45" y2="120" stroke="#2c4560" stroke-width="1.2" opacity=".55"/>
    <line x1="55" y1="78" x2="55" y2="120" stroke="#2c4560" stroke-width="1.2" opacity=".55"/>
    <!-- 裤脚卷边 -->
    <rect x="33.4" y="114" width="12.2" height="6" fill="#4d6f92" rx="1"/>
    <rect x="54.4" y="114" width="12.2" height="6" fill="#4d6f92" rx="1"/>

    <!-- = 鞋 = -->
    <path d="M31 120 L48 120 L48 128 Q48 131 45 131 L33 131 Q30 131 30 128 Z" fill="#fcfbf8"/>
    <path d="M52 120 L69 120 L70 128 Q70 131 67 131 L55 131 Q52 131 52 128 Z" fill="#fcfbf8"/>
    <rect x="30" y="128" width="18" height="3.4" rx="1.6" fill="#ddd8ce"/>
    <rect x="52" y="128" width="18" height="3.4" rx="1.6" fill="#ddd8ce"/>
    <!-- 鞋面的那一道 -->
    <path d="M33 124 L45 124" stroke="#e2ddd3" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M55 124 L67 124" stroke="#e2ddd3" stroke-width="1.4" stroke-linecap="round"/>

    <!-- = 上半身：白T恤 = -->
    <path d="M31 52 Q31 47 36 46 L64 46 Q69 47 69 52 L67 80 L33 80 Z" fill="url(#tee)"/>
    <!-- 袖口 -->
    <path d="M31 52 Q28 56 27 63 L33 65 Q33 58 34 53 Z" fill="#f4f1e7"/>
    <path d="M69 52 Q72 56 73 63 L67 65 Q67 58 66 53 Z" fill="#f4f1e7"/>

    <!-- = 背带裤（灵魂）= -->
    <path d="M40 47 L38 78" stroke="url(#denim)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M60 47 L62 78" stroke="url(#denim)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="40" cy="48.5" r="2.6" fill="#e8b958"/>
    <circle cx="60" cy="48.5" r="2.6" fill="#e8b958"/>
    <!-- 裤腰 + 前面的护胸片 -->
    <path d="M45 60 L55 60 L55 78 L45 78 Z" fill="url(#denim)"/>
    <rect x="33" y="74" width="34" height="8" rx="1.5" fill="url(#denim)"/>
    <!-- 护胸片上的口袋 + 扣子 -->
    <rect x="47.5" y="64" width="5" height="5" rx="1" fill="#4d6f92"/>
    <circle cx="50" cy="72" r="1.6" fill="#e8b958"/>

    <!-- = 手臂 = -->
    <path d="M33 53 Q28 62 27.5 72 Q27.2 78 29 82" stroke="url(#skin)" stroke-width="7"
          fill="none" stroke-linecap="round"/>
    <path d="M67 53 Q72 62 72.5 72 Q72.8 78 71 82" stroke="url(#skin)" stroke-width="7"
          fill="none" stroke-linecap="round"/>

    <!-- = 脖子 = -->
    <path d="M45 40 L55 40 L55 49 L45 49 Z" fill="#d9a26e"/>
    <ellipse cx="50" cy="42" rx="7" ry="2.6" fill="#b8824d" opacity=".42"/>

    <!-- = 头 = -->
    <ellipse cx="50" cy="28" rx="13.6" ry="15.4" fill="url(#skin)"/>
    <ellipse cx="36.6" cy="29" rx="2.2" ry="3.2" fill="#e8b581"/>
    <ellipse cx="63.4" cy="29" rx="2.2" ry="3.2" fill="#e8b581"/>

    <!-- 中分发型（灵魂） -->
    <path d="M50 8
             C36.5 8 31.2 16.6 31.2 26.4
             L31.2 33
             C32.9 26.6 36.4 21.5 43 18.4
             L50 15
             L57 18.4
             C63.6 21.5 67.1 26.6 68.8 33
             L68.8 26.4
             C68.8 16.6 63.5 8 50 8 Z"
          fill="url(#hair)"/>
    <path d="M50 9.6 L50 15.8" stroke="#6a5b4f" stroke-width="1" stroke-linecap="round" opacity=".95"/>
    <path d="M31.9 25.6 C31.3 30 32 33.3 33.1 35.1 L34.9 33.3 C33.9 30.2 33.8 27.2 34.4 24.4 Z" fill="#191411"/>
    <path d="M68.1 25.6 C68.7 30 68 33.3 66.9 35.1 L65.1 33.3 C66.1 30.2 66.2 27.2 65.6 24.4 Z" fill="#191411"/>

    <!-- 五官 -->
    <path d="M41.5 22.5 Q45 20.6 48.2 21.9" stroke="#2f2723" stroke-width="1.4"
          fill="none" stroke-linecap="round"/>
    <path d="M51.8 21.9 Q55 20.6 58.5 22.5" stroke="#2f2723" stroke-width="1.4"
          fill="none" stroke-linecap="round"/>
    <ellipse cx="44.6" cy="27.2" rx="2" ry="2.4" fill="#2f2723"/>
    <ellipse cx="55.4" cy="27.2" rx="2" ry="2.4" fill="#2f2723"/>
    <circle cx="45.3" cy="26.3" r="0.7" fill="#fff" opacity=".95"/>
    <circle cx="56.1" cy="26.3" r="0.7" fill="#fff" opacity=".95"/>
    <path d="M50 29 L48.9 32.7 L51.4 33" stroke="#c9925e" stroke-width="1.1"
          fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M45 37 Q50 40.6 55.6 35.9" stroke="#a25f38" stroke-width="1.5"
          fill="none" stroke-linecap="round"/>
    <ellipse cx="40.5" cy="32.5" rx="3.1" ry="1.9" fill="#e08a63" opacity=".25"/>
    <ellipse cx="59.5" cy="32.5" rx="3.1" ry="1.9" fill="#e08a63" opacity=".25"/>

    <!-- = 篮球：夹在右手腋下 = -->
    <circle cx="78" cy="72" r="11.5" fill="#d97a2a"/>
    <circle cx="78" cy="72" r="11.5" fill="none" stroke="#96501a" stroke-width="1.3"/>
    <path d="M66.5 72 L89.5 72" stroke="#96501a" stroke-width="1.2"/>
    <path d="M78 60.5 L78 83.5" stroke="#96501a" stroke-width="1.2"/>
    <path d="M69.5 64 Q78 72 69.5 80" stroke="#96501a" stroke-width="1.2" fill="none"/>
    <path d="M86.5 64 Q78 72 86.5 80" stroke="#96501a" stroke-width="1.2" fill="none"/>
    <ellipse cx="73" cy="66.5" rx="3.2" ry="2" fill="#f5b070" opacity=".6" transform="rotate(-35 73 66.5)"/>
  </g>
</svg>
